<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificate of Partnership</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        /* --- Reset & Page Setup --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f0f0f0;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Certificate Container (A4 Portrait) --- */
        .certificate-container {
            width: 210mm;
            height: 297mm;
            background-color: #ffffff;
            /* Using your SVG file as a crisp vector background border */
            background-image: url('transparent-image.png');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
            padding: 40mm 25mm;
            /* Safe padding zones inside the border */
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* --- Logo / Header Element --- */
        .header-logo {
            /* margin-bottom: 25mm; */
            text-align: center;
        }

        /* Inline SVG of your exact Kalash/Om emblem for complete self-containment */
        img {
            width: 250px;
            height: 250px;
        }

        /* --- Typography Styles --- */
        .certificate-title {
            font-family: 'Times New Roman', Times, serif;
            font-size: 38px;
            font-weight: 700;
            color: #c49a3c;
            /* Elegant Gold */
            text-transform: initial;
            letter-spacing: 1px;
            margin-bottom: 10mm;
        }

        .presentation-line {
            font-family: "Poppins", sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20mm;
        }

        /* Name / Recipient Slot */
        .recipient-name {
            font-family: 'Cinzel', serif;
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            width: 85%;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #c49a3c;
            /* Subtle gold line under name */
            margin-bottom: 15mm;
        }

        .certificate-body {
            font-family: "Poppins", sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: #333333;
            text-align: center;
            line-height: 2.2;
            width: 85%;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 700;
        }


        /* --- Footer / Signatures Layout --- */
        .certificate-footer {
            position: absolute;
            bottom: 46mm;
            /* Perfectly aligns with the original layout spacing */
            left: 25mm;
            right: 25mm;
            display: flex;
            justify-content: flex-start;
            /* Aligns signature block to the left */
            align-items: flex-end;
        }

        .signature-block {
            text-align: center;
            width: 250px;
        }

        .signature-line {
            /* Space holder for physical or digital signature script */
            height: 30px;
            margin-bottom: 5px;
        }

        .signer-name {
            font-size: 14px;
            font-weight: 700;
            color: #000000;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .signer-title {
            font-size: 11px;
            font-weight: 500;
            color: #555555;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* --- Print Optimization --- */
        @media print {
            body {
                background-color: #ffffff;
                padding: 0;
            }

            .certificate-container {
                box-shadow: none;
                page-break-after: always;
            }
        }
    </style>
</head>

<body>

    <div class="certificate-container">

        <div class="header-logo">
            <img src="https://poojapatha.com/images/logo-transparent.svg" alt="">
        </div>

        <h1 class="certificate-title">Certified Partner</h1>

        <p class="presentation-line">This Certificate is Proudly Presented To</p>

        <div class="recipient-name">

        </div>

        <p class="certificate-body">
            In recognition of our official business alliance and<br>
            shared commitment to excellence, integrity, and<br>
            mutual growth alongside Poojapatha Private Limited.
        </p>

        <div class="certificate-footer">
            <div class="signature-block">
                <div class="signature-line"></div>
                <div class="signer-name">Saroj Kumar Tarasia</div>
                <div class="signer-title">Managing Director</div>
            </div>
        </div>

    </div>

</body>

</html>
