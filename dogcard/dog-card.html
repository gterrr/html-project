<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* The Card Container */
        .profile-card {
            background-color: #f5f6fa;
            /* Light, slightly off-white background */
            width: 350px;
            padding: 40px 25px 30px 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

            /* The Secret Sauce: Arched Top */
            /* Top-left and top-right have a large radius, bottom corners are flat (0) */
            border-radius: 175px 175px 0 0;
        }

        /* Image Container & Image */
        .image-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        .image-container img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            /* Makes the image perfectly circular */
            object-fit: cover;
            /* Prevents distortion if the image isn't perfectly square */
        }

        /* Typography */
        .title {
            font-size: 2.2rem;
            font-weight: 300;
            /* Light font weight for that clean look */
            color: #2c3e50;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        /* Underline effect beneath the title */
        .title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 100%;
            height: 1px;
            background-color: #2c3e50;
        }

        .tagline {
            font-size: 1rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 30px;
        }

        /* Buttons Container */
        .actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            /* Space between the buttons */
        }

        /* Base Button Styling */
        .btn {
            background-color: #2d2d2d;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        /* Subtle hover effect for interactivity */
        .btn:hover {
            background-color: #1a1a1a;
        }

        .btn:active {
            transform: scale(0.98);
        }
        .btn-remove:hover{
            background-color: orangered;
        }
        .btn-follow:hover{
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="profile-card">
        <div class="image-container">
            <img src="https://ik.imagekit.io/d9mvewbju/Course/BigbinaryAcademy/dog-image_X63RHWucP.png" alt="Master Builder Profile Picture">
        </div>

        <h2 class="title">Master Builder</h2>
        <p class="tagline">Let's build and make new things.</p>

        <div class="actions">
            <button class="btn btn-follow">Follow</button>
            <button class="btn btn-remove">Remove</button>
        </div>
    </div>
</body>

</html>
